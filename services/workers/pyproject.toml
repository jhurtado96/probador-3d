[project]
name = "probador-workers"
version = "0.1.0"
description = "Workers GPU del probador virtual 3D (avatar, garment, drape, color). Esqueleto sin ML."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "jsonschema[format-nongpl]>=4.21",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
modal = ["modal>=0.64"]

[project.scripts]
probador-workers = "probador_workers.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/probador_workers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
