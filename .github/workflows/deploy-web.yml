# Publica la versión web de la app en EAS Hosting (Expo) al cambiar en main, o a mano desde Actions.
# Requiere en GitHub (Settings → Secrets and variables → Actions): EXPO_TOKEN (token de acceso de expo.dev).
# La URL y la clave publicable de Supabase son públicas y ya van en la app (src/lib/config.ts).
name: Publicar app web

on:
  push:
    branches: [main]
    paths:
      - "apps/app/**"
      - "packages/contracts/**"
      - "package-lock.json"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Comprobar que hay token de Expo
        run: |
          if [ -z "$EXPO_TOKEN" ]; then echo "::error::Falta el secreto EXPO_TOKEN en GitHub"; exit 1; fi

      - name: Instalar
        run: npm ci

      - name: Comprobaciones
        run: npm run check

      - name: Vincular el proyecto de expo.dev
        working-directory: apps/app
        run: npx --yes eas-cli@latest init --non-interactive --force

      - name: Exportar web
        working-directory: apps/app
        run: npx expo export --platform web

      - name: Publicar
        working-directory: apps/app
        run: npx --yes eas-cli@latest deploy --prod --non-interactive
